# OPTIONAL: headless browser capture (WITH_BROWSER=true).
#
# bootstrap-toolchain.sh copies this file to ~/.config/mise/conf.d/ when the key
# is on and deletes it when the key is off. See optional/paseo.toml for why the
# optional tools live in fragments instead of config.toml.
#
# The npm half of the feature; the Dockerfile block of the same name holds the
# shared libraries. `playwright-cli` is a plain npm package, so it lands in the
# home volume like Paseo does, and the same key that built the libraries into
# the image turns this on. The Chromium download runs later, in
# bootstrap-toolchain.sh, because it needs the CLI on the shims path first.
#
# Tracks latest, like Paseo, so `devaloy update` moves it with the rest. It
# was pinned to 0.1.18 for a while: 0.1.19 (2026-09-01) was published by hand
# with no npm provenance, and mise's npm backend treats that as a trust
# downgrade and refuses to install it. 0.1.20 onward carry provenance again
# (`npm view @playwright/cli@<v> dist.attestations`). If a later release drops
# it once more, `devaloy update` fails at `mise upgrade`; pin the last release
# with provenance here until upstream fixes it, rather than adding a
# trust-policy exclusion that would waive the check for every release.

[tools]
"npm:@playwright/cli" = "latest"
