# devaloy's OOM ladder on a native VM (WITH_DOCKER=true). docker-ce ships its
# unit at -500, level with tailscaled. -250 puts dockerd below the only way into
# the box, beside Paseo and T3 Code, and above a runaway build in a session
# (0). Installed by scripts/install-native.sh, which also writes the value into
# the running daemon, so a change needs no restart.
[Service]
OOMScoreAdjust=-250
