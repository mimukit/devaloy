# devaloy's OOM ladder on a native VM, top rung. tailscaled is the only way into
# the box, so it is the last process the kernel should pick: -500, the value
# the container gives PID 1 through compose. Docker, Paseo and T3 Code sit at
# -250 and sessions at 0. Installed by scripts/install-native.sh, which also
# writes the value into the running daemon, so a change needs no restart.
[Service]
OOMScoreAdjust=-500
