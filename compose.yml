services:
  tailscale:
    image: tailscale/tailscale:latest
    container_name: devaloy-tailscale
    hostname: devbox
    environment:
      - TS_AUTHKEY=${TS_AUTHKEY}
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_HOSTNAME=devbox
      - TS_USERSPACE=false
    volumes:
      - tailscale-state:/var/lib/tailscale
    devices:
      - /dev/net/tun:/dev/net/tun
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    # Keep tailscaled off the OOM killer's list — losing it severs every route
    # you'd use to recover the box.
    oom_score_adj: -500
    restart: unless-stopped

  devbox:
    build: .
    container_name: devaloy-devbox
    network_mode: service:tailscale
    depends_on:
      - tailscale
    init: true
    # sshd inherits this, so the kernel avoids killing the process that keeps
    # the box reachable. Interactive login shells raise themselves back to 0
    # (see entrypoint.sh), so a runaway build is the preferred victim. Docker
    # applies this itself — no CAP_SYS_RESOURCE needed on a container running
    # untrusted dev code.
    oom_score_adj: -500
    environment:
      - PUBLIC_KEY=${PUBLIC_KEY}
      # Optional pin overrides; empty falls through to bootstrap-toolchain.sh.
      - MISE_NODE_VERSION=${MISE_NODE_VERSION:-}
      - MISE_HERDR_VERSION=${MISE_HERDR_VERSION:-}
    volumes:
      - devbox-home:/home/dev
    restart: unless-stopped

volumes:
  tailscale-state:
  devbox-home:
