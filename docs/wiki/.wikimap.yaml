home: docs/wiki
engine: none
pages:
  - path: index.md
    documents: [README.md, docs/wiki/*.md]

  - path: getting-started.md
    mode: tutorial
    documents:
      - README.md
      - docker-compose.yml
      - Dockerfile
      - entrypoint.sh
      - bootstrap-toolchain.sh
      - .env.example

  - path: architecture.md
    mode: explanation
    documents:
      - Dockerfile
      - docker-compose.yml
      - entrypoint.sh
      - bootstrap-toolchain.sh
      - devaloy-update
      - link-shims
      - config/**

  - path: reference.md
    mode: reference
    documents:
      - docker-compose.yml
      - Dockerfile
      - .env.example
      - entrypoint.sh
      - bootstrap-toolchain.sh
      - devaloy-update
      - link-shims
      - scripts/**
      - config/zsh/zshrc

  - path: vm-resource-limits.md
    mode: how-to
    documents:
      - docker-compose.yml
      - entrypoint.sh
      - scripts/host-resource-guard.sh

  - path: harden-the-host.md
    mode: how-to
    documents:
      - scripts/host-firewall-lockdown.sh
      - scripts/host-resource-guard.sh

  - path: recover-an-unreachable-box.md
    mode: how-to
    documents:
      - entrypoint.sh
      - docker-compose.yml
      - devaloy-update
      - link-shims

  # --- adopted: written by a human, mapped but never claim-checked ---

  - path: deploy-with-dokploy.md
    mode: how-to
    adopted: true
    documents:
      - docker-compose.yml
      - Dockerfile
      - .env.example
      - scripts/host-firewall-lockdown.sh

  - path: pair-the-orca-apps.md
    mode: how-to
    adopted: true
    documents:
      - Dockerfile
      - docker-compose.yml
      - entrypoint.sh

  - path: push-notifications.md
    mode: how-to
    adopted: true
    documents:
      - config/bin/agent-push
      - config/claude/settings.json
      - config/codex/hooks.json
      - entrypoint.sh
      - docker-compose.yml

  - path: reading-docker-stats.md
    mode: reference
    adopted: true
    documents:
      - docker-compose.yml
      - scripts/host-resource-guard.sh
