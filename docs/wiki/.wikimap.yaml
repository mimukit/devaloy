home: docs/wiki
engine: none
pages:
  - path: index.md
    documents: [README.md, docs/wiki/*.md]

  - path: getting-started.md
    mode: tutorial
    documents:
      - README.md
      - docker-compose.yml
      - Dockerfile
      - entrypoint.sh
      - bootstrap-toolchain.sh
      - .env.example

  - path: architecture.md
    mode: explanation
    documents:
      - Dockerfile
      - docker-compose.yml
      - entrypoint.sh
      - bootstrap-toolchain.sh
      - devaloy
      - lib/**
      - link-shims
      - config/**

  - path: manage-the-box.md
    mode: how-to
    documents:
      - devaloy
      - lib/**
      - Dockerfile

  - path: reference.md
    mode: reference
    documents:
      - docker-compose.yml
      - Dockerfile
      - .env.example
      - entrypoint.sh
      - bootstrap-toolchain.sh
      - devaloy
      - lib/**
      - link-shims
      - scripts/**
      - config/zsh/zshrc

  - path: vm-resource-limits.md
    mode: how-to
    documents:
      - docker-compose.yml
      - entrypoint.sh
      - scripts/host-resource-guard.sh

  - path: lock-down-the-host-firewall.md
    mode: how-to
    documents:
      - scripts/host-firewall-lockdown.sh
      - .dockerignore

  - path: recover-an-unreachable-box.md
    mode: how-to
    documents:
      - entrypoint.sh
      - docker-compose.yml
      - devaloy
      - lib/**
      - link-shims

  - path: run-a-project-stack.md
    mode: how-to
    documents:
      - Dockerfile
      - docker-compose.yml
      - entrypoint.sh
      - config/docker/daemon.json
      - devaloy
      - lib/**
      - .env.example

  - path: update-the-toolchain.md
    mode: how-to
    documents:
      - bootstrap-toolchain.sh
      - devaloy
      - lib/**
      - link-shims
      - Dockerfile
      - config/zsh/zshrc

  - path: migrate-to-a-new-host.md
    mode: how-to
    documents:
      - docker-compose.yml
      - entrypoint.sh
      - .env.example

  - path: prepare-a-host-for-sysbox.md
    mode: how-to
    documents:
      - scripts/setup-sysbox-host.sh
      - scripts/host-resource-guard.sh
      - config/docker/daemon.json
      - config/docker/README.md

  # --- adopted: written by a human, mapped but never claim-checked ---

  - path: deploy-with-dokploy.md
    mode: how-to
    adopted: true
    documents:
      - docker-compose.yml
      - Dockerfile
      - .env.example
      - scripts/host-firewall-lockdown.sh

  - path: pair-the-orca-apps.md
    mode: how-to
    adopted: true
    documents:
      - Dockerfile
      - docker-compose.yml
      - entrypoint.sh

  - path: connect-the-paseo-apps.md
    mode: how-to
    adopted: true
    documents:
      - entrypoint.sh
      - bootstrap-toolchain.sh
      - docker-compose.yml
      - .env.example

  - path: push-notifications.md
    mode: how-to
    adopted: true
    documents:
      - config/bin/agent-push
      - config/claude/settings.json
      - config/codex/hooks.json
      - entrypoint.sh
      - docker-compose.yml

  - path: reading-docker-stats.md
    mode: reference
    adopted: true
    documents:
      - docker-compose.yml
      - scripts/host-resource-guard.sh

  - path: host-resource-guard.md
    mode: how-to
    adopted: true
    documents:
      - scripts/host-resource-guard.sh
      - .dockerignore
