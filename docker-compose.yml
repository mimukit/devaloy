services:
  devaloy:
    build:
      context: .
      args:
        # Builds in the optional `orca serve` runtime for the Orca desktop and
        # mobile apps. OFF by default: it takes the image from 683 MB to 1.6 GB,
        # and most boxes want the SSH story alone.
        #
        # This is a BUILD arg, not an environment variable — it decides what
        # goes into the image, so `docker compose up -d` alone will NOT pick up
        # a change to it. You need `--build`. There is deliberately no runtime
        # toggle; see the README.
        WITH_ORCA: ${WITH_ORCA:-false}
    container_name: devaloy
    hostname: devaloy
    init: true
    # Nothing is published. There is no `ports:` key on purpose, so nothing here
    # is reachable from the internet or from the Docker host's own network
    # interfaces. Tailscale SSH on the tailnet address — inside this container's
    # own network namespace — is the only *remote* way in.
    #
    # One nuance, if you build WITH_ORCA=true: `orca serve` binds 0.0.0.0 and
    # offers no bind-address flag, so port 6768 is also reachable on this
    # container's docker bridge IP from the Docker host itself. That is accepted
    # rather than firewalled — anyone on the host already holds the Docker
    # socket and can `docker exec` in as root, so the port grants them nothing
    # they did not already have. It does mean you should not attach other
    # containers to this container's network.
    cap_add:
      # tailscaled needs this to create and configure the tailscale0 interface.
      - NET_ADMIN
      # SYS_MODULE is deliberately NOT granted. It is only needed to *load* the
      # tun kernel module, and it is close to a container escape on a box that
      # runs arbitrary dev code and AI agents. Ensure the host has tun loaded
      # instead: `sudo modprobe tun` (see README).
    devices:
      - /dev/net/tun:/dev/net/tun
    security_opt:
      # Codex confines its shell with bubblewrap, which needs to create an
      # unprivileged user namespace. Docker's default seccomp profile denies
      # that (and pivot_root), so without this the agent sandbox silently
      # cannot engage — CAP_SYS_ADMIN alone does not fix it, the filter has to
      # come off. The trade: every syscall is now reachable from this
      # container, so the host kernel is the only thing left between an agent
      # and an escape. Accepted because the alternative is an unsandboxed
      # agent on a box that already has passwordless sudo.
      - seccomp=unconfined
    # Keeps tailscaled off the OOM killer's list — losing it severs the only
    # route you'd use to recover the box. Interactive shells raise themselves
    # back to 0 (see entrypoint.sh), so a runaway build is the preferred victim.
    # Docker applies this itself; no CAP_SYS_RESOURCE needed.
    oom_score_adj: -500
    environment:
      - TS_AUTHKEY=${TS_AUTHKEY:-}
      - TS_HOSTNAME=${TS_HOSTNAME:-devaloy}
      # Tailscale rewriting /etc/resolv.conf inside a container clobbers
      # Docker's resolver. Only turn this on if you need MagicDNS *from* the
      # box.
      - TS_ACCEPT_DNS=${TS_ACCEPT_DNS:-false}
      # Authenticates gh and git-over-HTTPS with no interactive login. The
      # entrypoint copies it into a 0600 file in the home volume, so clearing
      # it here and redeploying is what revokes it — see entrypoint.sh.
      - GITHUB_TOKEN=${GITHUB_TOKEN:-}
      # Optional pin overrides; empty falls through to bootstrap-toolchain.sh.
      - MISE_NODE_VERSION=${MISE_NODE_VERSION:-}
      - MISE_HERDR_VERSION=${MISE_HERDR_VERSION:-}
    volumes:
      - home:/home/dev
      # Node identity lives here. Lose it and the box rejoins as a new machine.
      - tailscale-state:/var/lib/tailscale
    restart: unless-stopped

volumes:
  home:
  tailscale-state:
