# The compose project name, which is also the prefix on every named volume at
# the bottom of this file (`${DEVALOY_NAME}_home`, `${DEVALOY_NAME}_docker-data`
# …). It defaults to `devaloy`, which is what a checkout in a `devaloy/`
# directory already got from the directory name — so an existing box keeps its
# existing volumes and there is nothing to migrate.
#
# Set DEVALOY_NAME to run a SECOND devaloy on one host. It is the single key
# that separates the two: container name, shell hostname, tailnet node name and
# volume prefix all derive from it, so two stacks share no name and no data.
#
# Dokploy overrides this. It always runs compose with an explicit `-p <appname>`
# and a `-p` flag beats this key, so under Dokploy the volume prefix stays the
# app name (already unique per app) and DEVALOY_NAME governs only the container
# name, the hostname and the tailnet node.
name: ${DEVALOY_NAME:-devaloy}

services:
  devaloy:
    build:
      context: .
      args:
        # Builds in the optional `orca serve` runtime for the Orca desktop and
        # mobile apps. OFF by default: it takes the image from 683 MB to 1.6 GB,
        # and most boxes want the SSH story alone.
        #
        # This is a BUILD arg, not an environment variable — it decides what
        # goes into the image, so `docker compose up -d` alone will NOT pick up
        # a change to it. You need `--build`. There is deliberately no runtime
        # toggle; see the README.
        WITH_ORCA: ${WITH_ORCA:-false}
        # Builds Docker Engine and Compose into the image, so a project's own
        # docker-compose.yml can start its development stack on this box. OFF by
        # default.
        #
        # Also a BUILD arg, for the same reason as WITH_ORCA above: it decides
        # what goes into the image, so `docker compose up -d` alone will NOT
        # pick up a change. You need `--build`.
        #
        # This one key is not enough on its own. The daemon needs authority over
        # its own namespaces, which is what DEVALOY_RUNTIME or DEVALOY_PRIVILEGED
        # further down grant — see the comment on those two.
        WITH_DOCKER: ${WITH_DOCKER:-false}
        # Builds the shared libraries a headless Chromium needs into the image,
        # so an agent on the box can render a page with `playwright-cli` and
        # screenshot it to /tmp. OFF by default: it takes the image from 660 MB
        # to 1.09 GB on arm64, and the bootstrap then adds a 982 MB Chromium to
        # the home volume.
        #
        # A BUILD arg like the two above, and for the same reason: it decides
        # what goes into the image, so `docker compose up -d` alone will NOT
        # pick up a change. You need `--build`.
        #
        # The same key is ALSO an environment variable further down. The build
        # arg puts the libraries in the image; the runtime key makes the
        # bootstrap install the CLI and the browser into the home volume, and
        # makes the entrypoint export the browser defaults. One thing to set in
        # .env, two readers, like WITH_DOCKER.
        WITH_BROWSER: ${WITH_BROWSER:-false}
    # A container name is global to the Docker daemon, and compose does NOT
    # prefix it with the project name the way it prefixes volumes. Two stacks
    # that both hardcode `devaloy` collide on it, and the second one fails to
    # create with "the container name /devaloy is already in use". Driving it
    # from DEVALOY_NAME is what lets a second devaloy exist on one host.
    #
    # The default keeps every `docker exec -it devaloy …` command in the README
    # and the wiki working unchanged. On a second stack, substitute the name you
    # set: `docker exec -it devaloy-two …`.
    container_name: ${DEVALOY_NAME:-devaloy}
    # Cosmetic next to the line above — a hostname lives in the container's own
    # UTS namespace, so a duplicate is legal and errors on nothing. It is driven
    # from the same key anyway, because the shell prompt is how you tell which
    # of two boxes you are typing into.
    hostname: ${DEVALOY_NAME:-devaloy}
    init: true
    # Nothing is published. There is no `ports:` key on purpose, so nothing here
    # is reachable from the internet or from the Docker host's own network
    # interfaces. Tailscale SSH on the tailnet address — inside this container's
    # own network namespace — is the only *remote* way in.
    #
    # One nuance, if you build WITH_ORCA=true: `orca serve` binds 0.0.0.0 and
    # offers no bind-address flag, so port 6768 is also reachable on this
    # container's docker bridge IP from the Docker host itself. That is accepted
    # rather than firewalled — anyone on the host already holds the Docker
    # socket and can `docker exec` in as root, so the port grants them nothing
    # they did not already have. It does mean you should not attach other
    # containers to this container's network.
    #
    # The Paseo daemon (WITH_PASEO=true) does NOT have that nuance, and the two
    # are worth telling apart rather than assuming they behave alike. Paseo
    # takes a bind address, so the entrypoint starts it with
    # `--listen <tailnet-ip>:6767`. Port 6767 exists only on the tailnet
    # interface: it is not on the docker bridge and the Docker host cannot reach
    # it. Both runtimes can run at once — different ports, no clash.
    cap_add:
      # tailscaled needs this to create and configure the tailscale0 interface.
      - NET_ADMIN
      # SYS_MODULE is deliberately NOT granted. It is only needed to *load* the
      # tun kernel module, and it is close to a container escape on a box that
      # runs arbitrary dev code and AI agents. Ensure the host has tun loaded
      # instead: `sudo modprobe tun` (see README).
    devices:
      - /dev/net/tun:/dev/net/tun
    security_opt:
      # Codex confines its shell with bubblewrap, which needs to create an
      # unprivileged user namespace. Docker's default seccomp profile denies
      # that (and pivot_root), so without this the agent sandbox silently
      # cannot engage — CAP_SYS_ADMIN alone does not fix it, the filter has to
      # come off. The trade: every syscall is now reachable from this
      # container, so the host kernel is the only thing left between an agent
      # and an escape. Accepted because the alternative is an unsandboxed
      # agent on a box that already has passwordless sudo.
      #
      # UNDER sysbox-runc THIS KEY IS IGNORED, and it stays here anyway. Sysbox
      # installs its own seccomp notification filter and keeps it on whatever
      # this says (measured: `Seccomp: 2` in /proc/self/status under
      # sysbox-runc, `Seccomp: 0` under runc). That costs nothing, because
      # Sysbox's filter traps and emulates rather than denying — bubblewrap's
      # user namespace works under it, which is the thing this key was added
      # for. The key still does real work in the runc shape, which is the one
      # DEVALOY_RUNTIME leaves as the default.
      - seccomp=unconfined
    # --- the two keys that make WITH_DOCKER's nested daemon actually run ---
    # A dockerd inside this container needs authority over its own namespaces.
    # Exactly one of the two below grants it, and which one you pick is a
    # property of the HOST, not of this box.
    #
    # DEVALOY_PRIVILEGED=true is the simple answer and the dangerous one. It is
    # all-or-nothing: there is no partial privileged, and it hands this
    # container every host device. An agent in here can `mount /dev/vda1` and
    # read and write the host's whole disk. Set it ONLY on a host you own alone
    # and would treat as disposable. On a machine with neighbours it means any
    # agent on this box can reach their data.
    #
    # DEVALOY_RUNTIME=sysbox-runc is the answer for a shared host. Sysbox
    # replaces runc, maps this container's root onto an unprivileged host user,
    # and runs the nested daemon with no privilege and no socket mount. Install
    # it on the host first — `scripts/host-resource-guard.sh --sysbox --check`
    # tells you what that needs, and the wiki page walks the restart window.
    #
    # Do not set both. Sysbox refuses a privileged container outright, so the
    # combination fails at start rather than silently picking one.
    #
    # Both default to the shape devaloy has always had: plain runc, no
    # privilege. With WITH_DOCKER unset they change nothing at all.
    privileged: ${DEVALOY_PRIVILEGED:-false}
    runtime: ${DEVALOY_RUNTIME:-runc}
    # Keeps tailscaled off the OOM killer's list — losing it severs the only
    # route you'd use to recover the box. Interactive shells raise themselves
    # back to 0 (see entrypoint.sh), so a runaway build is the preferred victim.
    # Docker applies this itself; no CAP_SYS_RESOURCE needed.
    oom_score_adj: -500
    # Resource ceilings, all OFF by default so the stack stays portable: a
    # hardcoded number here would bake in a host-size assumption, and 0 / -1
    # mean "unlimited" to Docker. Set them per host in .env.
    #
    # These matter most on a shared box. Without a mem_limit the container can
    # grow until the HOST runs out and the kernel picks a victim by oom_score,
    # which on a box with neighbours is rarely the process you would choose.
    # With one, the cgroup OOM killer fires inside this container only: it takes
    # the largest process here (an agent session, thanks to the oom_score_adj
    # above), tini survives as PID 1, and nothing else on the host notices.
    #
    # DEVALOY_MEMSWAP_LIMIT is the combined RAM+swap ceiling, not swap on its
    # own, so it must be >= DEVALOY_MEM_LIMIT and the difference is how much
    # swap this container may use. Leaving it at 0 lets Docker default it to
    # twice DEVALOY_MEM_LIMIT. Idle agent sessions are mostly cold pages and
    # swap well, so a generous allowance here buys you sessions that go slow
    # rather than sessions that die.
    #
    # See docs/wiki/vm-resource-limits.md for how to size all five.
    mem_limit: ${DEVALOY_MEM_LIMIT:-0}
    memswap_limit: ${DEVALOY_MEMSWAP_LIMIT:-0}
    mem_reservation: ${DEVALOY_MEM_RESERVATION:-0}
    cpus: ${DEVALOY_CPUS:-0}
    # Only bites under contention. Below 1024 means the neighbours win when both
    # want CPU at once, which is the right call when the neighbours are
    # someone's live site and this is a dev box.
    cpu_shares: ${DEVALOY_CPU_SHARES:-1024}
    pids_limit: ${DEVALOY_PIDS_LIMIT:--1}
    # /dev/shm. Docker's default is 64 MB, and a headless Chromium exhausts that
    # on a heavy page and crashes the tab. Playwright's Docker guide answers with
    # `--ipc=host`, which would hand this container the HOST's IPC namespace;
    # a bigger shm fixes the same crash without that. The trade: /dev/shm is a
    # tmpfs, so it costs nothing until written to, and what is written counts
    # against DEVALOY_MEM_LIMIT above. Set whether WITH_BROWSER is on or off,
    # because an unwritten tmpfs is free either way.
    shm_size: ${DEVALOY_SHM_SIZE:-512m}
    environment:
      - TS_AUTHKEY=${TS_AUTHKEY:-}
      # The tailnet node name, and the host part of `ssh dev@<name>`. It falls
      # through to DEVALOY_NAME so one key names the box everywhere, and setting
      # TS_HOSTNAME explicitly still wins for a box whose tailnet name already
      # differs from its container name.
      #
      # This one is global to the TAILNET, not to the host, so it needs a
      # distinct value even for two devaloy boxes on two different servers.
      # Reusing a name does not error: Tailscale silently joins the second node
      # as `<name>-1`, and your SSH alias then points at whichever one it
      # registered first.
      - TS_HOSTNAME=${TS_HOSTNAME:-${DEVALOY_NAME:-devaloy}}
      # Tailscale rewriting /etc/resolv.conf inside a container clobbers
      # Docker's resolver. Only turn this on if you need MagicDNS *from* the
      # box.
      - TS_ACCEPT_DNS=${TS_ACCEPT_DNS:-false}
      # Authenticates gh and git-over-HTTPS with no interactive login. The
      # entrypoint copies it into a 0600 file in the home volume, so clearing
      # it here and redeploying is what revokes it — see entrypoint.sh.
      - GITHUB_TOKEN=${GITHUB_TOKEN:-}
      # Authenticates Claude Code with no interactive `/login` on the box.
      # Generated on your own machine with `claude setup-token` (Pro/Max and up).
      # Same lifecycle as the GitHub token above: the entrypoint copies it into
      # the 0600 file in the home volume, and clearing it here plus a redeploy
      # is what revokes it.
      - CLAUDE_CODE_OAUTH_TOKEN=${CLAUDE_CODE_OAUTH_TOKEN:-}
      # Whitespace-separated repos to clone into ~/projects on each boot, as
      # owner/repo, an https:// URL, or git@host:path. The entrypoint skips a
      # repo already cloned there, so this is safe to re-run and cheap to grow.
      # Cloning goes over HTTPS through gh's credential helper, so a private
      # repo needs GITHUB_TOKEN above.
      - DEVALOY_REPOS=${DEVALOY_REPOS:-}
      # git identity for commits made on the box. Both optional: with a
      # GITHUB_TOKEN set, the entrypoint falls back to whoever that token
      # belongs to. Without either, every commit fails on "Author identity
      # unknown", so leaving all three empty is only right if you never commit
      # from here.
      - GIT_AUTHOR_NAME=${GIT_AUTHOR_NAME:-}
      - GIT_AUTHOR_EMAIL=${GIT_AUTHOR_EMAIL:-}
      # base64 of a passphrase-less OpenSSH private key — the one you already
      # use is fine — which signs every commit so GitHub shows it as Verified.
      # The entrypoint registers its public half on your account when the token
      # above has admin:ssh_signing_key. Same lifecycle as the tokens: written
      # into a 0600 file in the home volume on each boot, and clearing it here
      # plus a redeploy removes the key and stops signing.
      - GIT_SIGNING_SSH_KEY=${GIT_SIGNING_SSH_KEY:-}
      # ntfy push notifications when an agent blocks or finishes a long turn.
      # OFF unless NTFY_TOPIC is set — the topic string IS the credential, so
      # make it long and random. The entrypoint writes these into a 0600
      # ~/.config/agent-push.env in the home volume, rebuilt each boot, so
      # clearing NTFY_TOPIC here plus a redeploy is what turns it back off.
      - NTFY_TOPIC=${NTFY_TOPIC:-}
      - NTFY_SERVER=${NTFY_SERVER:-}
      - NTFY_TOKEN=${NTFY_TOKEN:-}
      # The optional Paseo daemon, for the Paseo phone, desktop, browser and CLI
      # clients. Read the contrast with WITH_ORCA in the build block above
      # carefully, because these look alike and are not: WITH_PASEO is an
      # ENVIRONMENT variable, not a build arg. Paseo is an npm package that
      # bootstrap-toolchain.sh installs into the home volume, so nothing goes
      # into the image and `docker compose up -d` alone picks up a change. No
      # --build needed.
      #
      # Turning it back off stops the daemon on the next boot. It does not
      # uninstall the CLI and it stops rewriting ~/.paseo/config.json rather
      # than deleting it, so re-enabling costs nothing. The daemon's settings
      # live in that file, merged each boot from config/paseo/config.json plus
      # the tailnet address. See the README.
      - WITH_PASEO=${WITH_PASEO:-false}
      # Serves Paseo's bundled web client from the daemon's own origin, so a
      # browser on the tailnet needs no app install. Separate key because the
      # static UI loads without auth. With no PASEO_PASSWORD set the entrypoint
      # warns and serves anyway — the API on the same address is open either
      # way, so gating only the UI would protect nothing.
      - WITH_PASEO_WEB_UI=${WITH_PASEO_WEB_UI:-false}
      # Optional, and DAEMON-wide rather than web-UI only: setting it also makes
      # the phone's direct connection ask for it. Same lifecycle as the tokens
      # above — the entrypoint writes it into the 0600 file in the home volume,
      # and clearing it here plus a redeploy is what revokes it.
      - PASEO_PASSWORD=${PASEO_PASSWORD:-}
      # Paseo plugins to install once the daemon answers. Whitespace-separated,
      # each entry a git source (`owner/repo:plugins/name`) or a directory on
      # the box, optionally prefixed `id=`. A plugin already installed is left
      # alone, so this is safe to re-run and cheap to grow. Plugins cannot ride
      # config/paseo/config.json — that file records a plugin only after
      # `paseo plugin install` has fetched it.
      - PASEO_PLUGINS=${PASEO_PLUGINS:-}
      # Optional pin overrides; empty falls through to bootstrap-toolchain.sh.
      # Only add one whose tool name is a real mise registry entry. mise treats
      # any MISE_<TOOL>_VERSION in the container environment as a declaration of
      # a tool called <TOOL>, so a name it does not know breaks every mise call
      # in every shell on the box. There is deliberately no Paseo entry here:
      # `paseo` is not a registry name (the package is npm:@getpaseo/cli), and
      # the CLI now tracks latest with no variable.
      - MISE_NODE_VERSION=${MISE_NODE_VERSION:-}
      - MISE_HERDR_VERSION=${MISE_HERDR_VERSION:-}
      # Read by entrypoint.sh to decide whether to start the nested daemon. The
      # build arg at the top of this file is what puts dockerd in the image;
      # this is what turns it on. Both come from the same .env key, so there is
      # one thing to set — but only a rebuild moves the first one.
      - WITH_DOCKER=${WITH_DOCKER:-false}
      # The runtime half of the build arg at the top of this file. Read by
      # bootstrap-toolchain.sh, which installs `playwright-cli` and the Chromium
      # build into the home volume, and by entrypoint.sh, which exports the
      # three PLAYWRIGHT_MCP_* defaults into every shell and warns when the
      # image was built without the libraries. Same one-key-two-readers shape
      # as WITH_DOCKER: only a rebuild moves the build arg.
      - WITH_BROWSER=${WITH_BROWSER:-false}
    volumes:
      - home:/home/dev
      # Node identity lives here. Lose it and the box rejoins as a new machine.
      - tailscale-state:/var/lib/tailscale
      # The nested daemon's image layers, containers and volumes. Its own volume
      # rather than the container's writable layer, for two reasons: image
      # layers do not belong in a layer that a rebuild throws away, and a
      # `docker volume rm ${DEVALOY_NAME}_docker-data` on the host is then how
      # you take
      # back every gigabyte of project images without touching a single repo.
      #
      # It is declared unconditionally, like the other two. An empty named
      # volume on a box built WITH_DOCKER=false costs nothing.
      #
      # Do NOT turn on Dokploy's volume backups for this one. It is pure cache:
      # everything in it is re-pullable or re-buildable, it is the largest thing
      # on the box, and backing it up buys nothing a `docker compose up` does
      # not. The `home` volume is the one worth protecting, and even there the
      # real backup is pushing to a remote.
      - docker-data:/var/lib/docker
    restart: unless-stopped

volumes:
  home:
  tailscale-state:
  docker-data:
